{% extends 'base.html' %}
{% load static ks_i18n %}

{% block title %}{% t "Bad request" %} — KaamSetu{% endblock %}

{% block content %}
<main class="auth-page">
  <section class="auth-card">
    <span class="eyebrow">400</span>
    <h1>{% t "Bad request" %}</h1>
    <p class="auth-intro">{% t "This request could not be understood. Please check the details and try again." %}</p>
    <div class="auth-form">
      <a class="button auth-submit" href="{% url 'core:landing' %}">{% t "Return home" %} <i data-lucide="arrow-right"></i></a>
    </div>
  </section>
</main>
{% endblock %}
