services:
  - type: web
    name: kaamsetu-free
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: KAAMSETU_SECRET_KEY
        generateValue: true
      - key: KAAMSETU_DEBUG
        value: "false"
      - key: KAAMSETU_ALLOWED_HOSTS
        value: kaamsetu-free.onrender.com
      - key: KAAMSETU_CSRF_TRUSTED_ORIGINS
        value: https://kaamsetu-free.onrender.com
      - key: KAAMSETU_SECURE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: kaamsetu-db
          property: connectionString

databases:
  - name: kaamsetu-db
    databaseName: kaamsetu
    user: kaamsetu
    plan: free
